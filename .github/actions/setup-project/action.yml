name: Set up project
description: >
  Installs pnpm at the version package.json pins, Node with a pnpm store cache,
  and the dependency tree. Shared by every CI job so the three cannot drift apart.

runs:
  using: composite
  steps:
    # No version here on purpose: action-setup reads the `packageManager` field
    # in package.json, so the pin lives in one place.
    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Install Node
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
